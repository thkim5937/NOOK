# DRAFT v0.2 - needs agreement with the frontend and UI teammates. Generated once, now edited by hand.
openapi: 3.1.0
info:
  title: NOOK API
  version: 0.2.0-draft
  summary: DRAFT v0.2 - needs agreement with the frontend and UI teammates before it is treated as final
  description: '**DRAFT v0.2 - needs agreement with the frontend and UI teammates before it is treated
    as final.**


    Derived from docs/endpoints.md. Operations marked `x-status: tbd` have open decisions (login method,
    coupon scope) and their shapes are placeholders. No endpoint is implemented
    yet.


    Pagination (`limit`, `cursor`, `next_cursor`) is a draft convention that needs frontend agreement.


    Option lists for industry, main customers, quiet hours and mood tags are PROVISIONAL (UI teammate
    decides). All example shops are fictional.'
servers:
- url: http://127.0.0.1:8000
  description: Local development
tags:
- name: business-profile
  description: F1 shop profile
- name: recommendations
  description: F2 AI recommendations
- name: collab-requests
  description: F3 collaboration requests
- name: ideas
  description: F6 AI collaboration ideas
- name: tbd
  description: 'F7 coupons/measurements: scope undecided'
paths:
  /v1/businesses:
    post:
      tags:
      - business-profile
      summary: Register a business and verify it on the server
      operationId: post_v1_businesses
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessRegistrationCreate'
            example:
              business_number: '0000000000'
              business_name: Fictional Cafe
              opening_date: '2024-03-01'
              industry: cafe
      responses:
        '201':
          description: Business row created by the server; verification_status is the lookup result.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BusinessRegistered'
              example:
                data:
                  id: 1
                  verification_status: verified
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerAuth: []
      description: 'Clients cannot insert business rows because the database rejects it (see docs/database.md);
        the server inserts the row after a tax-authority lookup.


        Result mapping: valid business number gives verification_status `verified`, invalid gives `rejected`,
        lookup unavailable gives `pending` (assumption). The lookup uses the user''s registered legal
        name (assumption). Each attempt counts toward a limit of 5 attempts per 10 minutes per user;
        over the limit gives 429 RATE_LIMITED. A business_number that is already registered gives 409
        REQUEST_INVALID_STATE. The app completes the rest of the profile afterwards directly in Supabase.'
  /v1/businesses/{business_id}/verification:
    post:
      tags:
      - business-profile
      summary: Verify the business registration number
      operationId: post_v1_businesses_business_id_verification
      x-status: tbd
      parameters:
      - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
            example:
              registration_number: 000-00-00000
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Verification'
              example:
                data:
                  status: pending
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder. This is also the retry
        path for businesses in `rejected` or `pending` state; retries count toward the same limit
        as POST /v1/businesses (5 attempts per 10 minutes per user), and the 429 RATE_LIMITED response
        applies.
  /v1/businesses/{business_id}/intro-draft:
    post:
      tags:
      - business-profile
      summary: AI-generated one-line intro draft for the owner to edit
      operationId: post_v1_businesses_business_id_intro_draft
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntroDraftRequest'
            example: &id001
              neighborhood_id: nbh_001
              industry: cafe
              main_customers: &id002
              - students
              quiet_hours: &id003
              - weekday_afternoon
              mood_tags: &id004
              - quiet
              - cozy
              intro: 조용히 공부하기 좋은 골목 안쪽 작은 다방
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/IntroDraft'
              example:
                data:
                  intro: 조용히 공부하기 좋은 골목 안쪽 작은 다방
                  ai_generated: true
                  disclosure: This content was generated by AI.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
      description: Response includes AI disclosure fields (`ai_generated`, `disclosure`); the client must
        show the disclosure.
  /v1/me/consents:
