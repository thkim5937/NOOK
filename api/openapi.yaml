components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: login method undecided (app vs web), see docs/auth-options.md
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size. DRAFT convention.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from a previous `next_cursor`. DRAFT convention.
  responses:
    Unauthorized:
      description: Not logged in, or token missing/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: Authentication required.
              details: []
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Not found.
              details: []
    InvalidState:
      description: Action not allowed in the resource's current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_INVALID_STATE
              message: Request is not in a state that allows this action.
              details: []
    ValidationFailed:
      description: Request body/params invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_VALIDATION_FAILED
              message: Request validation failed.
              details:
              - field: body.intro
                message: String should have at most 60 characters
                type: string_too_long
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              enum:
              - AUTH_REQUIRED
              - AUTH_FORBIDDEN
              - NOT_FOUND
              - REQUEST_INVALID_STATE
              - REQUEST_VALIDATION_FAILED
              - INTERNAL_ERROR
              - HTTP_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  type:
                    type: string
              description: Field errors for REQUEST_VALIDATION_FAILED; otherwise empty.
    DataResponse:
      type: object
      required:
      - data
      properties:
        data: {}
      description: Generic success wrapper; each operation narrows `data`.
    AIGeneratedMeta:
      type: object
      required:
      - ai_generated
      - disclosure
      properties:
        ai_generated:
          type: boolean
          default: true
        disclosure:
          type: string
          description: Placeholder wording, final text to be decided.
          example: This content was generated by AI.
    CollabRequest:
      type: object
      required:
      - id
      - sender_business_id
      - recipient_business_id
      - source
      - status
      properties:
        id:
          type: string
        sender_business_id:
          type: string
        recipient_business_id:
          type: string
        source:
          type: string
          enum:
          - ai_recommendation
          - collab_post
          - profile
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - CANCELLED
        post_id:
          type:
          - string
          - 'null'
          description: Set when source is collab_post.
    CollabRequestCreate:
      type: object
      required:
      - recipient_business_id
      - source
      properties:
        recipient_business_id:
          type: string
        source:
          type: string
          enum:
          - RECOMMENDATION
          - LOVE_CALL
          - PROFILE
        post_id:
          type:
          - string
          - 'null'
    BusinessProfile:
      type: object
      required:
      - industry
      - main_customers
      - quiet_hours
      - mood_tags
      - intro
      - neighborhood_id
      description: Option lists are PROVISIONAL (see data/samples/); the UI teammate decides the final
        lists.
      x-provisional: true
      properties:
        industry:
          type: string
          enum: &id008
          - cafe
          - bakery
          - restaurant
          - bookstore
          - flower_shop
          - gallery
          - fitness_studio
          - pottery_workshop
          - vintage_shop
          - bar
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        main_customers:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
            - students
            - office_workers
            - families
            - tourists
            - seniors
            - couples
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        quiet_hours:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
            - weekday_morning
            - weekday_afternoon
            - weekday_evening
            - weekend_morning
            - weekend_afternoon
            - weekend_evening
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        mood_tags:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: &id009
            - quiet
            - emotional
            - lively
            - cozy
            - trendy
            - vintage
            - minimal
            - family_friendly
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        intro:
          type: string
          minLength: 1
          maxLength: 60
        neighborhood_id:
          type: string
          pattern: ^nbh_[0-9]{3}$
        instagram_url:
          type:
          - string
          - 'null'
          format: uri
          description: Optional; see endpoints.md F1.
    VerificationRequest:
      type: object
      x-status: tbd
      description: Registry lookup vs document upload undecided.
      required:
      - registration_number
      properties:
        registration_number:
          type: string
    Verification:
      type: object
      x-status: tbd
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
    PhotoUploadRequest:
      type: object
      required:
      - count
      - content_type
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 3
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
    PhotoUploadResponse:
      type: object
      required:
      - uploads
      properties:
        uploads:
          type: array
          minItems: 1
          maxItems: 3
