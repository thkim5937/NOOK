# DRAFT v0.1 - needs agreement with the frontend and UI teammates. Generated once, now edited by hand.
openapi: 3.1.0
info:
  title: NOOK API
  version: 0.1.0-draft
  summary: DRAFT v0.1 - needs agreement with the frontend and UI teammates before it is treated as final
  description: '**DRAFT v0.1 - needs agreement with the frontend and UI teammates before it is treated
    as final.**


    Derived from docs/endpoints.md. Operations marked `x-status: tbd` have open decisions (login method,
    course flow, marketing links, coupon scope) and their shapes are placeholders. No endpoint is implemented
    yet.


    Pagination (`limit`, `cursor`, `next_cursor`) is a draft convention that needs frontend agreement.


    Option lists for industry, main customers, quiet hours and mood tags are PROVISIONAL (UI teammate
    decides). All example shops are fictional.'
servers:
- url: http://127.0.0.1:8000
  description: Local development
tags:
- name: business-profile
  description: F1 shop profile
- name: recommendations
  description: F2 AI recommendations
- name: collab-requests
  description: F3 collaboration requests
- name: posts
  description: F4 recruitment posts / love calls
- name: ideas
  description: F6 AI collaboration ideas
- name: courses
  description: F8 collaboration courses (owner side, tbd)
- name: public
  description: Public pages, no login
- name: tbd
  description: 'F5 marketing links and F7 coupons/measurements: scope undecided'
paths:
  /v1/me/business/verification:
    post:
      tags:
      - business-profile
      summary: Verify the business registration number
      operationId: post_v1_me_business_verification
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
            example:
              registration_number: 000-00-00000
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Verification'
              example:
                data:
                  status: PENDING
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/me/business:
    get:
      tags:
      - business-profile
      summary: Read own shop profile
      operationId: get_v1_me_business
      x-status: draft
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BusinessProfile'
              example:
                data: &id001
                  neighborhood_id: nbh_001
                  industry: cafe
                  main_customers: &id002
                  - students
                  quiet_hours: &id003
                  - weekday_afternoon
                  mood_tags: &id004
                  - quiet
                  - cozy
                  intro: 조용히 공부하기 좋은 골목 안쪽 작은 다방
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
    put:
      tags:
      - business-profile
      summary: Save own shop profile
      operationId: put_v1_me_business
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfile'
            example: *id001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BusinessProfile'
              example:
                data: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
  /v1/me/business/photos:
    post:
      tags:
      - business-profile
      summary: Get presigned upload URLs for shop photos (1-3)
      operationId: post_v1_me_business_photos
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
            example:
              count: 2
              content_type: image/jpeg
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PhotoUploadResponse'
              example:
                data:
                  uploads:
                  - upload_url: https://storage.example.test/upload/abc
                    photo_id: photo_001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
  /v1/me/business/intro-draft:
    post:
      tags:
      - business-profile
      summary: AI-generated one-line intro draft for the owner to edit
      operationId: post_v1_me_business_intro_draft
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntroDraftRequest'
            example: *id001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/IntroDraft'
              example:
                data:
                  intro: 조용히 공부하기 좋은 골목 안쪽 작은 다방
                  ai_generated: true
                  disclosure: This content was generated by AI.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
      description: Response includes AI disclosure fields (`ai_generated`, `disclosure`); the client must
        show the disclosure.
  /v1/me/consents:
    post:
      tags:
      - business-profile
      summary: Record consents
      operationId: post_v1_me_consents
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
            example:
              consents:
              - type: TERMS
                accepted: true
      responses:
        '204':
          description: Success, no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
  /v1/recommendations:
    get:
      tags:
      - recommendations
      summary: AI-recommended collaboration candidates
      operationId: get_v1_recommendations
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` for the next page; null on the last page. DRAFT convention.
              example:
                data:
                - business:
                    id: biz_003
                    name: 밀밭제빵소
                    neighborhood_id: nbh_001
                    industry: cafe
                    main_customers: *id002
                    quiet_hours: *id003
                    mood_tags: *id004
                    intro: 조용히 공부하기 좋은 골목 안쪽 작은 다방
                  reason: Quiet afternoon hours overlap and the customer groups complement each other.
                  ai_generated: true
                  disclosure: This content was generated by AI.
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bearerAuth: []
      description: Response includes AI disclosure fields (`ai_generated`, `disclosure`); the client must
        show the disclosure.
  /v1/recommendations/preferences:
    post:
      tags:
      - recommendations
      summary: Answer the AI's first-time question about the preferred partner
      operationId: post_v1_recommendations_preferences
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPreferences'
            example:
              preferred_industries:
              - bakery
              preferred_mood_tags:
              - cozy
      responses:
        '204':
          description: Success, no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
  /v1/collab-requests:
    post:
      tags:
      - collab-requests
      summary: Send a collaboration request
      operationId: post_v1_collab_requests
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollabRequestCreate'
            example:
              recipient_business_id: biz_003
              source: RECOMMENDATION
              post_id: null
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CollabRequest'
              example:
                data: &id005
                  id: req_001
                  sender_business_id: biz_001
                  recipient_business_id: biz_003
                  source: RECOMMENDATION
                  status: PENDING
                  post_id: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
    get:
      tags:
      - collab-requests
      summary: List sent or received requests
      operationId: get_v1_collab_requests
      x-status: draft
      parameters:
      - name: box
        in: query
        required: true
        schema:
          type: string
          enum:
          - sent
          - received
        description: Which box to list.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollabRequest'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` for the next page; null on the last page. DRAFT convention.
              example:
                data:
                - *id005
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
  /v1/collab-requests/{id}/accept:
    post:
      tags:
      - collab-requests
      summary: Recipient accepts a request
      operationId: post_v1_collab_requests_id_accept
      x-status: tbd
      parameters:
      - name: id
        in: path
        required: true
        description: Collaboration request id
        schema:
          type: string
        example: req_001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CollabRequest'
              example:
                data:
                  id: req_001
                  sender_business_id: biz_001
                  recipient_business_id: biz_003
                  source: RECOMMENDATION
                  status: ACCEPTED
                  post_id: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/collab-requests/{id}/reject:
    post:
      tags:
      - collab-requests
      summary: Recipient rejects a request
      operationId: post_v1_collab_requests_id_reject
      x-status: draft
      parameters:
      - name: id
        in: path
        required: true
        description: Collaboration request id
        schema:
          type: string
        example: req_001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CollabRequest'
              example:
                data:
                  id: req_001
                  sender_business_id: biz_001
                  recipient_business_id: biz_003
                  source: RECOMMENDATION
                  status: REJECTED
                  post_id: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
      security:
      - bearerAuth: []
  /v1/posts/{id}/love-call:
    post:
      tags:
      - collab-requests
      summary: Respond to a love call (creates a request with source LOVE_CALL)
      operationId: post_v1_posts_id_love_call
      x-status: draft
      parameters:
      - name: id
        in: path
        required: true
        description: Post id
        schema:
          type: string
        example: post_001
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CollabRequest'
              example:
                data:
                  id: req_001
                  sender_business_id: biz_001
                  recipient_business_id: biz_003
                  source: LOVE_CALL
                  status: PENDING
                  post_id: post_001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
      security:
      - bearerAuth: []
  /v1/posts:
    get:
      tags:
      - posts
      summary: List collaboration recruitment posts / love calls
      operationId: get_v1_posts
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` for the next page; null on the last page. DRAFT convention.
              example:
                data:
                - &id006
                  id: post_001
                  business_id: biz_003
                  title: Looking for a cafe partner for a morning bread-and-coffee set
                  body: We bake fresh bread every morning and want a nearby cafe to pair it with.
                  created_at: '2026-10-01T09:00:00Z'
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bearerAuth: []
    post:
      tags:
      - posts
      summary: Create a recruitment post / love call
      operationId: post_v1_posts
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
            example:
              title: Looking for a cafe partner for a morning bread-and-coffee set
              body: We bake fresh bread every morning and want a nearby cafe to pair it with.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
              example:
                data: *id006
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
  /v1/me/marketing-links:
    post:
      tags:
      - tbd
      summary: Link marketing data (AI input only, never shown to other owners)
      operationId: post_v1_me_marketing_links
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingLinkCreate'
            example:
              kind: INSTAGRAM
              url: https://instagram.example.test/moonlight_dabang
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MarketingLink'
              example:
                data:
                  id: mkl_001
                  kind: INSTAGRAM
                  url: https://instagram.example.test/moonlight_dabang
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/me/marketing-links/{id}:
    delete:
      tags:
      - tbd
      summary: Unlink marketing data
      operationId: delete_v1_me_marketing_links_id
      x-status: tbd
      parameters:
      - name: id
        in: path
        required: true
        description: Marketing link id
        schema:
          type: string
        example: mkl_001
      responses:
        '204':
          description: Success, no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/collab-requests/{id}/ideas:
    post:
      tags:
      - ideas
      summary: AI collaboration ideas and promotional content
      operationId: post_v1_collab_requests_id_ideas
      x-status: draft
      parameters:
      - name: id
        in: path
        required: true
        description: Collaboration request id
        schema:
          type: string
        example: req_001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Ideas'
              example:
                data:
                  ideas:
                  - title: Morning bread-and-coffee set
                    description: Pair a loaf with a drink at a bundled price.
                  promo_text: Fresh bread meets slow coffee, two doors apart.
                  ai_generated: true
                  disclosure: This content was generated by AI.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      description: Response includes AI disclosure fields (`ai_generated`, `disclosure`); the client must
        show the disclosure.
  /v1/public/coupons/{code}/scan:
    post:
      tags:
      - tbd
      summary: Record a coupon/QR scan or redemption
      operationId: post_v1_public_coupons_code_scan
      x-status: tbd
      parameters:
      - name: code
        in: path
        required: true
        description: Coupon code
        schema:
          type: string
        example: MOON-0001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CouponScanResult'
              example:
                data:
                  recorded: true
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/me/measurements:
    get:
      tags:
      - tbd
      summary: Coupon/QR effect results
      operationId: get_v1_me_measurements
      x-status: tbd
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Measurement'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` for the next page; null on the last page. DRAFT convention.
              example:
                data:
                - coupon_code: MOON-0001
                  scans: 12
                  redemptions: 4
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/courses:
    post:
      tags:
      - courses
      summary: Create a collaboration course
      operationId: post_v1_courses
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
            example:
              neighborhood_id: nbh_001
              business_ids:
              - biz_001
              - biz_003
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
              example:
                data:
                  id: crs_001
                  slug: moonlight-alley-walk
                  neighborhood_id: nbh_001
                  title: Moonlight Alley slow afternoon
                  stops: &id007
                  - order: 1
                    business_id: biz_001
                    benefit: Free cookie with any drink
                  - order: 2
                    business_id: biz_003
                    benefit: 10% off bread
                  status: DRAFT
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/courses/{id}/confirm:
    post:
      tags:
      - courses
      summary: Owner confirms the course
      operationId: post_v1_courses_id_confirm
      x-status: tbd
      parameters:
      - name: id
        in: path
        required: true
        description: Course id
        schema:
          type: string
        example: crs_001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
              example:
                data:
                  id: crs_001
                  slug: moonlight-alley-walk
                  neighborhood_id: nbh_001
                  title: Moonlight Alley slow afternoon
                  stops: *id007
                  status: CONFIRMED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/courses/{id}/publish:
    post:
      tags:
      - courses
      summary: Publish the course to the public page
      operationId: post_v1_courses_id_publish
      x-status: tbd
      parameters:
      - name: id
        in: path
        required: true
        description: Course id
        schema:
          type: string
        example: crs_001
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
              example:
                data:
                  id: crs_001
                  slug: moonlight-alley-walk
                  neighborhood_id: nbh_001
                  title: Moonlight Alley slow afternoon
                  stops: *id007
                  status: PUBLISHED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
      security:
      - bearerAuth: []
      description: Open decision, see docs/endpoints.md; shape is a placeholder.
  /v1/public/neighborhoods:
    get:
      tags:
      - public
      summary: Neighborhood list (customer picks manually, no GPS)
      operationId: get_v1_public_neighborhoods
