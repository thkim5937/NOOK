          minimum: 1
        business_id:
          type: string
        benefit:
          type: string
    Course:
      type: object
      x-status: tbd
      description: Course flow undecided; AI draft plus owner confirmation is only a proposal.
      required:
      - id
      - slug
      - neighborhood_id
      - title
      - stops
      - status
      properties:
        id:
          type: string
        slug:
          type: string
        neighborhood_id:
          type: string
        title:
          type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/CourseStop'
        status:
