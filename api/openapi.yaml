                format: uri
              photo_id:
                type: string
    IntroDraftRequest:
      type: object
      description: Profile fields used as AI input.
      properties:
        industry:
          $ref: '#/components/schemas/BusinessProfile/properties/industry'
        main_customers:
          $ref: '#/components/schemas/BusinessProfile/properties/main_customers'
        quiet_hours:
          $ref: '#/components/schemas/BusinessProfile/properties/quiet_hours'
        mood_tags:
          $ref: '#/components/schemas/BusinessProfile/properties/mood_tags'
    IntroDraft:
