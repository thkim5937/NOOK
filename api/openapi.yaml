components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: login method undecided (app vs web), see docs/auth-options.md
  parameters:
    BusinessId:
      name: business_id
      in: path
      required: true
      description: Business id; the caller must own it (one account can own several businesses).
      schema:
        type: integer
    BusinessIdQuery:
      name: business_id
      in: query
      required: true
      description: The business the caller acts as; one account can own several businesses. The server
        verifies ownership and answers 403 AUTH_FORBIDDEN otherwise.
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size. DRAFT convention.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from a previous `next_cursor`. DRAFT convention.
  responses:
    Unauthorized:
      description: Not logged in, or token missing/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: Authentication required.
              details: []
    Forbidden:
      description: Authenticated but not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_FORBIDDEN
              message: Not allowed.
              details: []
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Not found.
              details: []
    InvalidState:
      description: Action not allowed in the resource's current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_INVALID_STATE
              message: Request is not in a state that allows this action.
              details: []
    ValidationFailed:
      description: Request body/params invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_VALIDATION_FAILED
              message: Request validation failed.
              details:
              - field: body.intro
                message: String should have at most 60 characters
                type: string_too_long
    RateLimited:
      description: Too many verification attempts (5 per 10 minutes per user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many verification attempts. Try again later.
              details: []
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              enum:
              - AUTH_REQUIRED
              - AUTH_FORBIDDEN
              - NOT_FOUND
              - REQUEST_INVALID_STATE
              - REQUEST_VALIDATION_FAILED
              - INTERNAL_ERROR
              - HTTP_ERROR
              - RATE_LIMITED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  type:
                    type: string
              description: Field errors for REQUEST_VALIDATION_FAILED; otherwise empty.
    DataResponse:
      type: object
      required:
      - data
      properties:
        data: {}
      description: Generic success wrapper; each operation narrows `data`.
    AIGeneratedMeta:
      type: object
      required:
      - ai_generated
      - disclosure
      properties:
        ai_generated:
          type: boolean
          default: true
        disclosure:
          type: string
          description: Placeholder wording, final text to be decided.
          example: This content was generated by AI.
    CollabRequest:
      type: object
      required:
      - id
      - sender_business_id
      - receiver_business_id
      - source
      - status
      - post_id
      - match_id
      - message
      - collab_type
      - desired_timing
      - responded_at
      properties:
        id:
          type: integer
          minimum: 1
        sender_business_id:
          type: integer
        receiver_business_id:
          type: integer
        source:
          type: string
          enum:
          - ai_recommendation
          - collab_post
          - profile
        status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          - cancelled
        post_id:
          type:
          - integer
          - 'null'
          description: Set when source is collab_post; null otherwise.
        match_id:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
        collab_type:
          type:
          - string
          - 'null'
          enum: &collab_type_enum
          - limited_product
          - popup
          - joint_event
          - sns_collab
          - null
          description: PROVISIONAL value list until the data teammate fixes the DB catalog.
          x-provisional: true
        desired_timing:
          type:
          - string
          - 'null'
        responded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null while the request is pending.
    CollabRequestCreate:
      type: object
      required:
      - sender_business_id
      - receiver_business_id
      - source
      properties:
        sender_business_id:
          type: integer
          minimum: 1
          description: The business the caller acts as; the server must verify that the caller owns it
            and answer 403 AUTH_FORBIDDEN otherwise.
        receiver_business_id:
          type: integer
        source:
          type: string
          enum:
          - ai_recommendation
          - collab_post
          - profile
        post_id:
          type:
          - integer
          - 'null'
          description: Required when source is collab_post; must be null otherwise.
        match_id:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
        collab_type:
          type:
          - string
          - 'null'
          enum: *collab_type_enum
          description: PROVISIONAL value list until the data teammate fixes the DB catalog.
          x-provisional: true
        desired_timing:
          type:
          - string
          - 'null'
    BusinessProfile:
      type: object
      required:
      - id
      - industry
      - main_customers
      - quiet_hours
      - mood_tags
      - intro
      - neighborhood_id
      description: Option lists are PROVISIONAL (see data/samples/); the UI teammate decides the final
        lists.
      x-provisional: true
      properties:
        id:
          type: integer
          minimum: 1
        industry:
          type: string
          enum:
          - cafe
          - bakery
          - restaurant
          - bookstore
          - flower_shop
          - gallery
          - fitness_studio
          - pottery_workshop
          - vintage_shop
          - bar
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        main_customers:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
            - students
            - office_workers
            - families
            - tourists
            - seniors
            - couples
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        quiet_hours:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
            - weekday_morning
            - weekday_afternoon
            - weekday_evening
            - weekend_morning
            - weekend_afternoon
            - weekend_evening
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        mood_tags:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
            - quiet
            - emotional
            - lively
            - cozy
            - trendy
            - vintage
            - minimal
            - family_friendly
          description: PROVISIONAL option list copied from data/samples/; the UI teammate decides the
            final list.
        intro:
          type: string
          minLength: 1
          maxLength: 60
        neighborhood_id:
          type: string
          pattern: ^nbh_[0-9]{3}$
        instagram_url:
          type:
          - string
          - 'null'
