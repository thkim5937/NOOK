                description: Consent types not yet defined; TERMS is an example.
              accepted:
                type: boolean
    Recommendation:
      allOf:
      - $ref: '#/components/schemas/AIGeneratedMeta'
      - type: object
        required:
        - business
        - reason
        properties:
          business:
            allOf:
            - type: object
              required:
              - id
              - name
              properties:
                id:
                  type: string
                name:
