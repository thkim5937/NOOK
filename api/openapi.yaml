      summary: AI-recommended collaboration candidates
      operationId: get_v1_recommendations
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/BusinessIdQuery'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` for the next page; null on the last page. DRAFT convention.
              example:
                data:
                - match_id: 7
                  business:
                    id: 3
                    name: 밀밭제빵소
                    neighborhood_id: nbh_001
                    industry: cafe
                    main_customers: *id002
                    quiet_hours: *id003
                    mood_tags: *id004
                    intro: 조용히 공부하기 좋은 골목 안쪽 작은 다방
                  reason: Quiet afternoon hours overlap and the customer groups complement each other.
                  ai_generated: true
                  disclosure: This content was generated by AI.
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      description: Response includes AI disclosure fields (`ai_generated`, `disclosure`); the client must
        show the disclosure.
